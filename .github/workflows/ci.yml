name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    # El backend es un proyecto Node autocontenido dentro del monorepo.
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:14
        ports: ['5432:5432']
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: saas
        options: >-
          --health-cmd="pg_isready -U postgres" --health-interval=10s --health-timeout=5s --health-retries=5
      redis:
        image: redis:6
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # pnpm/action-setup DEBE ir ANTES de setup-node, o el cache 'pnpm' falla.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24.11.0'
          cache: 'pnpm'
          # El lock vive en backend/, no en la raíz del monorepo.
          cache-dependency-path: backend/pnpm-lock.yaml

      - name: Install dependencies
        # En GitHub Actions CI=true → pnpm usa --frozen-lockfile automático.
        run: pnpm install

      # Gate de seguridad supply-chain (nivel MÁXIMO): rompe el build ante
      # cualquier vuln high/critical. Bloqueante, fail-fast tras el install.
      # Sin excepciones: el audit gate pasa limpio a nivel high.
      - name: Security audit
        run: pnpm audit --audit-level high

      - name: Copy env
        run: cp .env.example .env

      - name: Start MinIO server
        # El service container de MinIO no soporta `command:` en GitHub Actions.
        # Lo levantamos como proceso en background en el step directamente.
        # MinIO necesita MINIO_ROOT_USER/PASSWORD como env vars y el comando server.
        run: |
          docker run -d --name minio-ci \
            -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio:latest server /data
          # Esperar a que MinIO esté listo
          for i in $(seq 1 20); do
            curl -sf http://localhost:9000/minio/health/live && break
            sleep 2
          done

      - name: Generate Prisma Client
        run: pnpm exec prisma generate

      - name: Run Prisma migrations
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/saas
        run: pnpm exec prisma migrate deploy

      - name: Lint
        run: pnpm run lint

      - name: Unit + Integration tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/saas
          REDIS_HOST: localhost
          MINIO_ENDPOINT: localhost
          MINIO_PORT: "9000"
          MINIO_ACCESS_KEY: minioadmin
          MINIO_SECRET_KEY: minioadmin
          MINIO_BUCKET: avicont-adjuntos
          MINIO_USE_SSL: "false"
          # file-type v16 es ESM puro; NODE_OPTIONS habilita import() dinámico en Jest.
          NODE_OPTIONS: --experimental-vm-modules
        run: pnpm exec jest src/ --runInBand

      # E2E full-stack a través de HTTP (Supertest + AppModule). Ver CLAUDE.md §11.3.
      # --forceExit porque PrismaClient deja handles que Jest no detecta.
      - name: E2E tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/saas
          REDIS_HOST: localhost
          MINIO_ENDPOINT: localhost
          MINIO_PORT: "9000"
          MINIO_ACCESS_KEY: minioadmin
          MINIO_SECRET_KEY: minioadmin
          MINIO_BUCKET: avicont-adjuntos
          MINIO_USE_SSL: "false"
          JWT_ACCESS_SECRET: ci-access-secret
          JWT_REFRESH_SECRET: ci-refresh-secret
          # file-type v16 es ESM puro; NODE_OPTIONS habilita import() dinámico en Jest.
          NODE_OPTIONS: --experimental-vm-modules
        run: pnpm exec jest test/ --runInBand --forceExit

  frontend:
    runs-on: ubuntu-latest
    # El frontend es un proyecto Vite + React autocontenido dentro del monorepo.
    # No necesita servicios (Postgres/Redis): los tests son de UI/unidad (Vitest).
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # pnpm/action-setup DEBE ir ANTES de setup-node, o el cache 'pnpm' falla.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24.11.0'
          cache: 'pnpm'
          # El lock vive en frontend/, no en la raíz del monorepo.
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install

      # Gate de seguridad supply-chain (nivel MÁXIMO), bloqueante, fail-fast.
      - name: Security audit
        run: pnpm audit --audit-level high

      - name: Lint
        run: pnpm run lint

      - name: Unit tests
        run: pnpm exec vitest run

      - name: Build
        run: pnpm run build

  # Gates de UI sobre el build servido con vite preview:
  #   1. gate:ui  — ninguna pantalla recorta contenido horizontalmente.
  #   2. gate:tap — los primitivos del piso táctil miden ≥44×44 bajo dedo y su
  #      box de 44px no le roba el click a otro control.
  #
  # El primer invariante se eligió CON DATOS, no a ojo (ver
  # docs/claude/verificacion-frontend.md §6): en su momento "tap targets ≥44px"
  # se descartó porque lo violaban 141 de 217 controles — un gate que nace con
  # excepciones no assertea nada. Los PRs #285/#286 y el piso en los 4
  # primitivos (checkbox/switch/tabs/select) llevaron ese baseline a cero, y
  # desde entonces el segundo gate lo congela. Ambos nacen con allowlist vacía.
  #
  # Necesita el stack real porque toda pantalla vive detrás del login. Los pasos
  # de infra son los mismos que ya usa `contract-drift`; lo que suma es el seed
  # (el gate entra con el usuario founder) y servir el build del frontend.
  ui-gate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:14
        ports: ['5432:5432']
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: saas
        options: >-
          --health-cmd="pg_isready -U postgres" --health-interval=10s --health-timeout=5s --health-retries=5
      redis:
        image: redis:6
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/saas
      REDIS_HOST: localhost
      JWT_ACCESS_SECRET: ci-access-secret
      JWT_REFRESH_SECRET: ci-refresh-secret
      MINIO_ENDPOINT: localhost
      MINIO_PORT: "9000"
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: avicont-adjuntos
      MINIO_USE_SSL: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24.11.0'
          cache: 'pnpm'
          cache-dependency-path: backend/pnpm-lock.yaml

      - name: Start MinIO server
        # AppModule bootstrapea MinioStorageAdapter.onModuleInit → ensureBucket.
        run: |
          docker run -d --name minio-ui-gate \
            -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio:latest server /data
          for i in $(seq 1 20); do
            curl -sf http://localhost:9000/minio/health/live && break
            sleep 2
          done

      - name: Install backend dependencies
        working-directory: backend
        run: pnpm install

      - name: Copy env
        working-directory: backend
        run: cp .env.example .env

      - name: Generate Prisma Client
        working-directory: backend
        run: pnpm exec prisma generate

      - name: Run Prisma migrations
        working-directory: backend
        run: pnpm exec prisma migrate deploy

      - name: Seed
        # `seed` crea el usuario founder + la org piloto con los que entra el gate.
        # `seed:packs` otorga los entitlements: la org del seed se crea con un
        # upsert directo de Prisma, no por TenantsService, así que no recibe los
        # packs otorgados por default.
        working-directory: backend
        run: |
          pnpm run seed
          pnpm run seed:packs

      - name: Build backend
        working-directory: backend
        run: pnpm run build

      - name: Start backend
        working-directory: backend
        run: |
          node dist/main.js > /tmp/backend.log 2>&1 &
          for i in $(seq 1 40); do
            curl -sf -o /dev/null http://localhost:3000/api/health && exit 0
            sleep 2
          done
          echo "::error::El backend no respondió en /api/health"
          cat /tmp/backend.log
          exit 1

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install

      - name: Install Chromium
        # El binario no viaja en el pnpm install; --with-deps trae las libs del SO.
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium

      - name: Build frontend
        working-directory: frontend
        run: pnpm run build

      - name: Start preview server
        # Se sirve el BUILD, no el dev server: el gate mide lo que recibe el usuario.
        # El proxy /api → :3000 lo define `preview` en vite.config.ts.
        working-directory: frontend
        run: |
          pnpm run preview > /tmp/preview.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://localhost:4173/ && exit 0
            sleep 2
          done
          echo "::error::El preview no respondió en :4173"
          cat /tmp/preview.log
          exit 1

      - name: UI gate
        working-directory: frontend
        run: pnpm run gate:ui

      - name: Tap targets gate
        # Emula (pointer: coarse) por su cuenta — gate:ui corre en modo
        # escritorio a propósito y este invariante solo existe bajo dedo.
        # Reusa el mismo stack (backend + seed + preview) que el paso anterior.
        working-directory: frontend
        run: pnpm run gate:tap

      - name: Backend log on failure
        if: failure()
        run: tail -100 /tmp/backend.log || true

  # Gate anti-drift del contrato OpenAPI (deuda "openapi-typescript", CLAUDE.md §10.10).
  # Regenera el contrato (backend/openapi.json) y los tipos del frontend
  # (api.generated.ts) desde el código actual. Si un DTO del backend cambió y
  # no se regeneraron los artefactos, el `git diff --exit-code` rompe el build.
  # Así el frontend nunca queda desincronizado del backend sin que nadie lo note.
  contract-drift:
    runs-on: ubuntu-latest
    # El dump bootea el AppModule de Nest, que conecta Postgres y Redis en bootstrap.
    services:
      postgres:
        image: postgres:14
        ports: ['5432:5432']
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: saas
        options: >-
          --health-cmd="pg_isready -U postgres" --health-interval=10s --health-timeout=5s --health-retries=5
      redis:
        image: redis:6
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # pnpm/action-setup DEBE ir ANTES de setup-node, o el cache 'pnpm' falla.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24.11.0'
          cache: 'pnpm'
          cache-dependency-path: backend/pnpm-lock.yaml

      - name: Install backend dependencies
        working-directory: backend
        run: pnpm install

      - name: Copy env
        working-directory: backend
        run: cp .env.example .env

      - name: Generate Prisma Client
        working-directory: backend
        run: pnpm exec prisma generate

      - name: Run Prisma migrations
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/saas
        run: pnpm exec prisma migrate deploy

      - name: Start MinIO server
        # AppModule bootstraps MinioStorageAdapter.onModuleInit → ensureBucket → necesita MinIO.
        run: |
          docker run -d --name minio-drift \
            -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio:latest server /data
          for i in $(seq 1 20); do
            curl -sf http://localhost:9000/minio/health/live && break
            sleep 2
          done

      - name: Dump OpenAPI spec
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/saas
          REDIS_HOST: localhost
          JWT_ACCESS_SECRET: ci-access-secret
          JWT_REFRESH_SECRET: ci-refresh-secret
          MINIO_ENDPOINT: localhost
          MINIO_PORT: "9000"
          MINIO_ACCESS_KEY: minioadmin
          MINIO_SECRET_KEY: minioadmin
          MINIO_BUCKET: avicont-adjuntos
          MINIO_USE_SSL: "false"
        run: pnpm run openapi:dump

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install

      - name: Generate frontend API types
        working-directory: frontend
        run: pnpm run gen:api-types

      - name: Verify contract & generated types are in sync
        run: |
          git diff --exit-code backend/openapi.json frontend/src/types/api.generated.ts \
            || { echo "::error::Contrato OpenAPI o tipos generados desincronizados. Corré 'pnpm run openapi:dump' (backend) + 'pnpm run gen:api-types' (frontend) y commiteá los artefactos."; exit 1; }
