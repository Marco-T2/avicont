# frontend/pnpm-workspace.yaml
# Configuración single-project de pnpm 11 (sin campo `packages`: este repo no usa
# workspaces reales; cada proyecto Node es independiente).

# Cero install scripts en el árbol del frontend (verificado): allowBuilds vacío
# bloquea TODO build de dependencia. Si pnpm reporta un build ignorado en
# `pnpm install` (exit 1, ERR_PNPM_IGNORED_BUILDS), NO agregar a ciegas:
# investigar el paquete primero.
allowBuilds: {}

# Cooldown de versiones nuevas (nivel de seguridad MÁXIMO). En MINUTOS.
# 4320 = 72h. Igual que backend. Una versión publicada hace < 72h no se instala.
minimumReleaseAge: 4320
minimumReleaseAgeStrict: true

# Overrides de seguridad: fuerzan la versión parcheada de dependencias
# transitivas con advisory HIGH (pnpm audit --audit-level high las bloquea).
# - form-data <4.0.6 (vía axios): GHSA-hmw2-7cc7-3qxx (CRLF injection).
# - vite 8.0.0–8.0.15: GHSA-fx2h-pf6j-xcff (server.fs.deny bypass).
# - undici 7.0.0–7.27.x (vía jsdom/vitest, solo dev): GHSA-vxpw-j846-p89q /
#   GHSA-hm92-r4w5-c3mj / TLS cert bypass. Parche 7.28.0 (maduro). Dev-only: no entra
#   al runtime del bundle. Tope <8: jsdom@29 alcanza internals de undici (wrap-handler)
#   que cambiaron en 8.x; sin el tope, el override sube a 8.x y rompe jsdom.
#
# Tanda 2026-07 (advisories publicados DESPUÉS del último merge a main; ambas entran
# por el toolchain de build/test, ninguna llega al bundle de runtime):
# - brace-expansion GHSA-3jxr-9vmj-r5cp (DoS por expansión exponencial de grupos {}
#   consecutivos). Dos líneas de versión con parche propio cada una: 2.x (vía eslint>
#   @eslint/config-array>minimatch) y 5.x (vía write-excel-file>archiver-node>minimatch
#   y openapi-typescript>@redocly/openapi-core>minimatch). Se acotan POR MAJOR: un
#   override global forzaría a todos los consumidores a la misma major.
# - js-yaml GHSA-52cp-r559-cp3m (consumo cuadrático de CPU por cadenas de merge keys).
#   Vía openapi-typescript>@redocly/openapi-core. 4.3.0 es minor dentro de la misma
#   major; se acota a ^4 para no saltar a la 5 (que sí cambió API).
# (axios GHSA-gcfj-64vw-6mp9 —proxy heredado tras clonar config en interceptores— NO
#  va acá: es dependencia DIRECTA y se subió en package.json a ^1.18.0.)
#
# Tanda 2026-07-24:
# - postcss <=8.5.17 GHSA-r28c-9q8g-f849 (path traversal al auto-cargar el source map
#   previo vía sourceMappingURL → lectura arbitraria de .map). Entra por vite (7 paths:
#   @tailwindcss/vite, @vitejs/plugin-react, @vitest/ui>vitest>@vitest/mocker). Toolchain
#   de build, no llega al bundle de runtime. Parche 8.5.18 publicado 2026-07-12 — maduro,
#   fuera del cooldown.
overrides:
  form-data: '>=4.0.6'
  vite: '>=8.0.16'
  undici: '^7.28.0'
  'brace-expansion@2': '^2.1.2'
  'brace-expansion@5': '^5.0.7'
  'js-yaml@4': '^4.3.0'
  postcss: '>=8.5.18'

# Excepciones del audit gate (pnpm audit --audit-level high). Time-boxed: solo para
# advisories cuyo PARCHE existe pero aún no es instalable por nuestro propio
# minimumReleaseAge (72h). Remover en cuanto el parche madure y bumpear la dep.
# - react-router >=7.12.0 <8.3.0 GHSA-qwww-vcr4-c8h2 (HIGH): en RSC Mode una action se
#   ejecuta ANTES de devolver el 400 del chequeo CSRF. Avicont usa Data Mode
#   (createBrowserRouter + RouterProvider), NO RSC Mode: el código vulnerable no se
#   alcanza. `pnpm audit` no distingue modos, solo lee la versión.
#   Parche: react-router 8.3.0, publicado 2026-07-22 15:04 UTC → madura 2026-07-25
#   ~15:04 UTC (11:04 La Paz).
#   ACCIÓN al madurar: NO alcanza con bumpear. `react-router-dom` no tiene v8 (quedó en
#   7.18.1: desde v7 el paquete principal es `react-router` y el -dom era una cáscara de
#   compatibilidad, eliminada en v8). Hay que migrar los 66 imports de 64 archivos de
#   'react-router-dom' a 'react-router', pasar la dep directa a react-router@^8.3.0 y
#   subir react/react-dom de ^19.2.5 a >=19.2.7 (peer que exige v8). Verificado: los 13
#   símbolos que usa el proyecto (Link, NavLink, Navigate, Outlet, Route, Routes,
#   RouterProvider, createBrowserRouter, MemoryRouter, useLocation, useNavigate,
#   useParams, useSearchParams) siguen exportados desde la entrada principal de v8.
#   Al ser un major puede haber cambios de comportamiento que solo revelan tsc + la
#   suite; por eso va como change propio y no como bump acá. BORRAR este ignore ahí.
# - brace-expansion GHSA-mh99-v99m-4gvg (HIGH): DoS por expansión sin límite de longitud
#   → crash por out-of-memory. Distinto del GHSA-3jxr-9vmj-r5cp ya cubierto por los
#   overrides de arriba; este afecta a TODA la línea 5.x hasta 5.0.7 inclusive, o sea a
#   la versión a la que nos pinea `'brace-expansion@5': '^5.0.7'`.
#   Superficie real: solo toolchain de build/test (eslint, write-excel-file>archiver-node,
#   openapi-typescript>@redocly/openapi-core). Un DoS por expansión de llaves exige
#   un patrón glob hostil; los patrones acá son literales del repo, no input de terceros.
#   Nada de esto llega al runtime.
#   Parche: 5.0.8, publicado 2026-07-23 11:39 UTC → madura 2026-07-26 ~11:39 UTC
#   (07:39 La Paz). ACCIÓN al madurar: el override `^5.0.7` YA admite 5.0.8 — alcanza con
#   `pnpm update brace-expansion` para mover el lockfile, sin tocar este archivo. Después
#   BORRAR este ignore.
auditConfig:
  ignoreGhsas:
    - GHSA-qwww-vcr4-c8h2
    - GHSA-mh99-v99m-4gvg
