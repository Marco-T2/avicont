# backend/pnpm-workspace.yaml
# Configuración single-project de pnpm 11 (NO hay campo `packages`: este repo no
# usa workspaces reales; cada proyecto Node es independiente).

# Bloqueo de lifecycle scripts (vector #1 de supply-chain). pnpm NO corre el
# build/postinstall de una dependencia salvo que esté en `true` aquí.
# Conservador: solo los paquetes que GENUINAMENTE necesitan compilar/generar.
allowBuilds:
  # --- true: necesitan correr su build/postinstall para funcionar ---
  bcrypt: true            # binding nativo (node-gyp); sin build no hashea passwords
  prisma: true            # CLI: descarga/posiciona los query engines
  '@prisma/client': true  # postinstall genera el client tipado contra el schema
  '@prisma/engines': true # posiciona los binarios de engine de Prisma
  # --- false: postinstall de telemetría/innecesario; bloquear es seguro ---
  '@nestjs/core': false   # postinstall solo emite telemetría de instalación
  '@scarf/scarf': false   # paquete de analytics de terceros; cero valor funcional
  protobufjs: false       # postinstall innecesario para nuestro uso (OTel)
  unrs-resolver: false    # postinstall de binarios no requeridos en runtime

# Cooldown de versiones nuevas (nivel de seguridad MÁXIMO). En MINUTOS.
# 4320 = 72h. Una versión publicada hace < 72h NO se instala (la mayoría de los
# ataques de supply-chain se detectan/yankean en las primeras horas).
# Default de pnpm 11 es 1440 (24h); lo subimos a 72h.
minimumReleaseAge: 4320
# Strict: el cooldown aplica también a transitivas/peer, no solo a deps directas.
minimumReleaseAgeStrict: true

# Overrides de seguridad: fuerzan la versión parcheada de dependencias
# transitivas con advisory HIGH (pnpm audit --audit-level high las bloquea).
# - form-data <4.0.6 (vía supertest/@types/supertest): GHSA-hmw2-7cc7-3qxx (CRLF injection).
# - protobufjs <=7.6.0 (vía @nestjs/terminus>@grpc, @opentelemetry): DoS por Any expansion.
# - multer <2.2.0 (vía @nestjs/platform-express, 8 rutas): GHSA-72gw-mp4g-v24j (DoS por
#   nombres de campo profundamente anidados). El override cubre las transitivas; la dep
#   directa (devDependencies) también se subió a ^2.2.0.
#
# Tanda 2026-07 (advisories publicados DESPUÉS del último merge a main; ninguna de
# estas deps es directa, todas entran por el toolchain de build/test):
# - brace-expansion GHSA-3jxr-9vmj-r5cp (DoS por expansión exponencial de grupos {}
#   consecutivos). Afecta 3 líneas de versión distintas, cada una con su propio parche:
#   1.x (vía @nestjs/cli>fork-ts-checker-webpack-plugin), 2.x (vía jest>@jest/core) y
#   5.x (vía @nestjs/cli>glob>minimatch). Se acotan POR MAJOR: un override global
#   forzaría a todos los consumidores a la misma major y rompería a los que dependen
#   de la API vieja.
# - js-yaml GHSA-52cp-r559-cp3m (consumo cuadrático de CPU por cadenas de merge keys).
#   Dos líneas: 3.x (vía jest>@jest/reporters) y 4.x (vía @nestjs/swagger). Mismo
#   criterio de acotar por major: js-yaml 4 cambió la API respecto de 3.
# - fast-uri GHSA-v2hh-gcrm-f6hx + GHSA-4c8g-83qw-93j6 (host confusion por delimitador
#   de autoridad y por canonicalización IDN fallida). Vía @nestjs/cli>@angular-devkit/
#   core>ajv. 3.1.4 cierra ambos; se acota a ^3 para no saltar a la major 4.
# - @opentelemetry/propagator-jaeger GHSA-45rx-2jwx-cxfr (DoS por excepción no manejada
#   ante un header malformado). Vía @opentelemetry/sdk-node, que lo registra en la lista
#   de propagadores por default. El override sube solo este paquete en vez de bumpear
#   todo el stack OTel; como 2.9.0 pinea @opentelemetry/core a 2.9.0 exacto, convive una
#   segunda copia de core en el árbol (aislada, sin estado global compartido: el estado
#   global vive en @opentelemetry/api, que sigue en una sola copia).
overrides:
  form-data: '>=4.0.6'
  protobufjs: '>=7.6.1'
  multer: '>=2.2.0'
  'brace-expansion@1': '^1.1.16'
  'brace-expansion@2': '^2.1.2'
  'brace-expansion@5': '^5.0.7'
  'js-yaml@3': '^3.15.0'
  'js-yaml@4': '^4.3.0'
  'fast-uri': '^3.1.4'
  '@opentelemetry/propagator-jaeger': '^2.9.0'

# Excepciones del audit gate (pnpm audit --audit-level high). Time-boxed: solo
# para advisories cuyo PARCHE existe pero aún no es instalable por nuestro propio
# minimumReleaseAge (72h). Remover en cuanto el parche madure y bumpear la dep.
# - nodemailer GHSA-p6gq-j5cr-w38f (HIGH): la opción `raw` a nivel de mensaje bypassa
#   disableFileAccess/disableUrlAccess (arbitrary file read / SSRF). NO la usamos
#   (smtp.adapter solo pasa from/to/subject/text/html/replyTo/attachments). Parche 9.0.1
#   publicado 2026-06-17, bloqueado por el cooldown hasta ~2026-06-20. ACCIÓN: al madurar,
#   bumpear nodemailer ^7→^9.0.1 (+ @types/nodemailer) y BORRAR este ignore.
# - brace-expansion GHSA-mh99-v99m-4gvg (HIGH): DoS por expansión sin límite de longitud
#   → crash por out-of-memory. Distinto del GHSA-3jxr-9vmj-r5cp ya cubierto por los
#   overrides de arriba; este afecta a TODA la línea 5.x hasta 5.0.7 inclusive, o sea a
#   la versión a la que nos pinea `'brace-expansion@5': '^5.0.7'`.
#   Superficie real: solo toolchain de build/test (@nestjs/cli, eslint, jest). Un DoS por expansión de llaves exige
#   un patrón glob hostil; los patrones acá son literales del repo, no input de terceros.
#   Nada de esto llega al runtime.
#   Parche: 5.0.8, publicado 2026-07-23 11:39 UTC → madura 2026-07-26 ~11:39 UTC
#   (07:39 La Paz). ACCIÓN al madurar: el override `^5.0.7` YA admite 5.0.8 — alcanza con
#   `pnpm update brace-expansion` para mover el lockfile, sin tocar este archivo. Después
#   BORRAR este ignore.
auditConfig:
  ignoreGhsas:
    - GHSA-p6gq-j5cr-w38f
    - GHSA-mh99-v99m-4gvg
